# ==============================================================================
# VPS (10.33.0.1) 反向代理配置参考 (Nginx)
# 作用: 将 https://agent.li33.art/safe 转发至算力机 10.33.0.30:8000
# ==============================================================================

# 将以下配置加入到 agent.li33.art 的 HTTPS server 块内：
# 例如: /etc/nginx/sites-available/agent.li33.art 或 /etc/nginx/conf.d/agent.conf

location /safe/ {
    proxy_pass http://10.33.0.30:8000/safe/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 支持流式输出与低延迟长连接
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_buffering off;
}

# 访问 /safe 时自动补齐尾斜杠重定向
location = /safe {
    return 301 /safe/;
}
