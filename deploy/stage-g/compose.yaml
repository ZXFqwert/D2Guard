# Linux compute deployment. No Docker socket, host networking or privileged containers.
services:
  runtime:
    image: alpine:3.19
    user: "1000:1000"
    working_dir: ${D2_REPO}
    entrypoint: ["/usr/bin/sleep", "infinity"]
    read_only: true
    cap_drop: [ALL]
    # Permit unprivileged nested namespaces; exec gets a second empty mount root.
    security_opt: ["no-new-privileges:true", "seccomp:unconfined", "apparmor:unconfined"]
    pids_limit: 512
    devices: ["/dev/nvidia0:/dev/nvidia0", "/dev/nvidiactl:/dev/nvidiactl", "/dev/nvidia-uvm:/dev/nvidia-uvm"]
    mem_limit: 16g
    tmpfs: [/tmp]
    environment:
      HOME: /home/roots
      USER: roots
      LOGNAME: roots
      TZ: Asia/Taipei
      TORCHINDUCTOR_CACHE_DIR: /tmp/torchinductor
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      RAYON_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
      PYTHONPATH: src:.:tests
      NPM_CONFIG_PREFIX: ${D2_REPO}/.local/pi-runtime
      CUDA_VISIBLE_DEVICES: "0"
      D2_OS_SANDBOX: "1"
      D2_UPSTREAM_UDS: ${D2_REPO}/.local/stage-g/upstream.sock
      D2_GIT_REPO_ROOT: ${D2_REPO}/.local/stage-g/git-remotes
    volumes:
      - /usr:/usr:ro
      - /lib:/lib:ro
      - /lib64:/lib64:ro
      - /etc/ssl/certs:/etc/ssl/certs:ro
      - /home/roots/.local/lib/python3.12/site-packages:/home/roots/.local/lib/python3.12/site-packages:ro
      - ${D2_REPO}:${D2_REPO}
    networks: [isolated]
  attacker:
    image: alpine:3.19
    user: "1000:1000"
    working_dir: /fixture
    entrypoint: ["/usr/bin/python3", "/fixture/attacker.py"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 256m
    tmpfs: [/tmp]
    volumes:
      - /usr:/usr:ro
      - /lib:/lib:ro
      - /lib64:/lib64:ro
      - ${D2_REPO}/deploy/stage-g:/fixture:ro
      - ${D2_REPO}/.local/stage-g/git-remotes:/repos
      - ${D2_REPO}/.local/stage-g/attacker:/receipts
    networks: [isolated]
networks:
  isolated:
    internal: true
