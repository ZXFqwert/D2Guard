# Include within the existing HTTPS server. Port 18768 is a loopback-only
# SSH reverse tunnel to the compute host's console on port 8768.
location = /safe/preview {
    return 302 /safe/preview/;
}
location = /safe/preview/api/settings {
    default_type application/json;
    return 403 '{"error":"演示浏览入口不提供模型配置，请使用本机控制台。"}';
}
location ^~ /safe/preview/ {
    if ($request_method != GET) {
        return 403 '{"error":"此入口用于浏览真实演示记录；运行、审批和配置请使用本机控制台。"}';
    }
    proxy_pass http://127.0.0.1:18768/;
    proxy_set_header Host 127.0.0.1;
    proxy_set_header Accept-Encoding "";
    proxy_read_timeout 120s;
    sub_filter_once off;
    sub_filter_types text/javascript;
    sub_filter '/api/' '/safe/preview/api/';
    sub_filter '<div class="nav-foot">' '<div class="nav-foot"><div>同学预览 · 真实记录 · 只读</div>';
    add_header Cache-Control "no-store";
    add_header X-Content-Type-Options nosniff always;
}
