# Include within the existing HTTPS server. Port 18768 is a loopback-only
# SSH reverse tunnel to the compute host's console on port 8768.
location = /safe/preview {
    return 302 /safe/preview/;
}
location ^~ /safe/preview/api/settings {
    if ($request_method != GET) {
        return 403 '{"error":"共享测试使用已配置的模型，模型连接配置由部署端维护。"}';
    }
    proxy_pass http://127.0.0.1:18768/api/settings;
    proxy_set_header Host 127.0.0.1;
    add_header Cache-Control "no-store";
}
location ^~ /safe/preview/ {
    proxy_pass http://127.0.0.1:18768/;
    proxy_set_header Host 127.0.0.1;
    proxy_set_header Origin http://127.0.0.1;
    proxy_set_header Accept-Encoding "";
    proxy_read_timeout 120s;
    sub_filter_once off;
    sub_filter_types text/javascript;
    sub_filter '/api/' '/safe/preview/api/';
    sub_filter '<div class="nav-foot">' '<div class="nav-foot"><div>云端测试 · 算力机执行</div>';
    add_header Cache-Control "no-store";
    add_header X-Content-Type-Options nosniff always;
}
