[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "d2guard-core"
version = "1.0.0"
description = "Contract-driven dual-mirror agent runtime audit kernel"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.11,<3", "uvicorn>=0.30,<1", "httpx>=0.28,<1", "PyYAML>=6,<7", "regex>=2024.11", "bashlex>=0.18,<1"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
onnx = ["onnxruntime>=1.20,<2", "tokenizers>=0.20,<1", "numpy>=1.26,<3"]
laya = ["laya>=0.4.6,<0.5"]

[tool.setuptools]
py-modules = ["models", "config", "extractor", "mirrors", "state_machine", "storage", "policy_engine", "execution", "approval", "server", "desktop_api"]

[tool.setuptools.data-files]
"share/d2guard_core" = ["D2guard_contract.json", "policies.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
